version: 2
updates:
  # Release toolchain (semantic-release + conventional-changelog).
  # All deps are devDependencies; http-cli itself is a bash script with no
  # runtime deps. Group every bump into a single weekly PR to keep noise low
  # and to keep the toolchain current (which is what prevents advisories like
  # the handlebars criticals from re-accruing).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      release-toolchain:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
